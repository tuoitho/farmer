services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: nong-dan-ai-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nong_dan_ai
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - nong-dan-ai-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/nong_dan_ai --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nong-dan-ai-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # MongoDB Configuration
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=nong_dan_ai
      
      # JWT Configuration
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      
      # External API Configuration
      # External API Configuration
      - OPENWEATHERMAP_API_KEY=${OPENWEATHERMAP_API_KEY}
      - OPENWEATHERMAP_API_URL=${OPENWEATHERMAP_API_URL:-https://api.openweathermap.org/data/2.5}
      
      # Clova Studio API Configuration
      - CLOVA_STUDIO_API_KEY=${CLOVA_STUDIO_API_KEY}
      - CLOVA_STUDIO_REQUEST_ID=${CLOVA_STUDIO_REQUEST_ID}
      
      # Application Configuration
      - APP_NAME=NÔNG DÂN AI
      - APP_VERSION=1.0.0
      - DEBUG=False
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:8080"]
    volumes:
      - ./app:/app/app
      - ./main.py:/app/main.py
    networks:
      - nong-dan-ai-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  nong-dan-ai-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
